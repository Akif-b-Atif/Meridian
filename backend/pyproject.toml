[project]
name = "meridian-api"
version = "1.0.0"
description = "Backend for Meridian, a city profile explorer built on free public data"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012", "B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["perf: resource tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM102", "B017", "RUF001"]
"scripts/*" = ["S310"]
